name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Prisma generate
        run: bunx prisma generate
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Build
        env:
          BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-12
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/covered?schema=public
          EMAIL_DEV_MODE: "true"
          CRON_SECRET: ci-cron-secret
        run: bun run build
